server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Liveness/readiness target.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Runtime config must never be cached (exact match wins over the regex below).
  location = /config.js {
    add_header Cache-Control "no-store";
    try_files /config.js =404;
  }

  # The HTML shell references hashed asset names; never serve a stale one.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # SPA fallback so client-side routes resolve to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
    expires 1h;
    add_header Cache-Control "public";
  }
}
