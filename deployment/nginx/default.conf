# Cache-Control per path. Declared with `map` and applied as a single
# server-level `add_header`, because nginx only inherits `add_header` from the
# server level if a location defines none of its own — a location-level
# `add_header Cache-Control` would silently drop the security headers.
map $uri $rriv_cache_control {
  default                                          "no-cache";
  /config.js                                       "no-store";
  ~*\.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$  "public, max-age=3600";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # CSP + hardening headers. Generated at container start from the RRIV_*
  # environment (origins are not known at build time) by
  # 40-rriv-config.sh -> /etc/nginx/rriv/security-headers.conf.
  include /etc/nginx/rriv/security-headers.conf;

  add_header Cache-Control $rriv_cache_control always;

  # Liveness/readiness target.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Runtime config must never be cached.
  location = /config.js {
    try_files /config.js =404;
  }

  # SPA fallback so client-side routes resolve to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
